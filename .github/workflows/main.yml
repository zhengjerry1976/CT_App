name: Build Flet APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.1.2
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build APK with Flet
        run: flet build apk --verbose
        env:
          PIP_INDEX_MIRROR: https://mirrors.aliyun.com/pypi/simple/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            build/**/*.apk
