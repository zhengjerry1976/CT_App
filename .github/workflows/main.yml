name: Build Flet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet
        run: pip install flet==1.1.2

      - name: Build APK
        run: flet build apk --python-version 3.12
        env:
          PIP_INDEX_MIRROR: https://mirrors.aliyun.com/pypi/simple/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: |
            build/**/*.apk
            **/app-release.apk
            **/app.apk
