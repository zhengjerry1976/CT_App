name: Build Flet APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # 整个任务最多 45 分钟，卡死自动失败，绝不再跑 2 小时
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.1.2 -i https://mirrors.aliyun.com/pypi/simple/
          if [ -f requirements.txt ]; then pip install -r requirements.txt -i https://mirrors.aliyun.com/pypi/simple/; fi

      - name: Build APK
        run: flet build apk --verbose
        timeout-minutes: 35

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/**/*.apk
