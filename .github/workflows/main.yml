name: Build Flet APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # 整个任务最多 45 分钟，卡死自动失败，不浪费时间
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Flet & Deps (阿里云镜像加速)
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.1.2 -i https://mirrors.aliyun.com/pypi/simple/
          # 注意：如果 requirements.txt 里有 pandas/matplotlib，请先去文件里注释掉，否则极易卡死！
          if [ -f requirements.txt ]; then pip install -r requirements.txt -i https://mirrors.aliyun.com/pypi/simple/; fi

      - name: Build APK (让 Flet 自动处理 Flutter 环境)
        run: flet build apk --verbose
        timeout-minutes: 35

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: app-release-apk
          path: build/**/*.apk
