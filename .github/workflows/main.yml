name: Build Flet APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # 强制适配 Node 24（消除警告，防未来报错）
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flutter SDK (Mirror)
        run: |
          # 使用清华/中科大镜像下载 Flutter（避坑境外网络）
          wget -q https://mirrors.tuna.tsinghua.edu.cn/flutter/flutter_infra_release/releases/stable/linux/flutter_linux_3.24.5-stable.tar.xz -O flutter.tar.xz
          tar -xf flutter.tar.xz -C $HOME
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          flutter --version

      - name: Install Flet & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==1.1.2 -i https://mirrors.aliyun.com/pypi/simple/
          if [ -f requirements.txt ]; then pip install -r requirements.txt -i https://mirrors.aliyun.com/pypi/simple/; fi

      - name: Build APK
        run: flet build apk --verbose
        timeout-minutes: 35

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/**/*.apk
